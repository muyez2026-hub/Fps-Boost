name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unzip project
        run: unzip fps-boost-mod-mc1.21.1.zip
      - name: Build
        run: cd fps-boost && gradle build
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: fps-boost-mod
          path: fps-boost/build/libs/fps-boost-*.jar
          
